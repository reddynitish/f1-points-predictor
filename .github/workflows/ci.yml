name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install locked environment
        run: make install
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned api-anything runtime installation
        run: |
          npm ci --prefix tools/api-anything
          tools/api-anything/node_modules/.bin/api-anything --help
      # Tests use synthetic fixtures only; no upstream data is downloaded in CI.
      - name: Lint, type-check and test
        run: make check
      - name: Verify saved artifacts and offline demo
        run: |
          make verify-portfolio
          make demo
          make dashboard
